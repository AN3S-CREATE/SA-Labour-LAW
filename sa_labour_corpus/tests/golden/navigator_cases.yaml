# Golden fact patterns for the Dismissal Navigator.
#
# Each case states facts and the outcome the navigator is expected to give.
# The expectations were written by the navigator's author from LRA s186-s194
# and EEA s10 as held in this corpus. They are NOT yet signed off by a
# practising labour lawyer. Until a case carries `reviewed_by` and
# `reviewed_on`, treat its expectation as the author's reading, not as law.
#
# Produce the review sheet a lawyer signs:
#   labour-corpus navigate review-sheet > navigator-review.md
#
# Expectation keys (all optional except track):
#   track                 arbitration | labour_court | election | eea_labour_court
#   classification_has    substring of the classification label
#   due                   list of due dates, one per deadline ("pending" = not started)
#   status                list of deadline statuses, one per deadline
#   route                 provision keys of the route steps, in order
#   remedy                provision key of the remedy ceiling (null = none)
#   onus                  true if LRA s192(2) applies
#   forum_has             substring of the first route step's forum
#   warning_has           substring of some warning or deadline note

review:
  status: pending_lawyer_review
  reviewer_instructions: >-
    For each case, check the expected track, deadlines and route against the
    LRA and EEA. Mark AGREE, or DISAGREE with the correct outcome and the
    provision relied on. Do not assess fairness: the navigator does not.

cases:
  - id: conduct-open
    as_of: 2026-10-07
    facts: {reason: conduct, event_date: 2026-09-20}
    expect: {track: arbitration, due: [2026-10-20], status: [open],
             route: [lra_191_1_a, lra_191_5_a], remedy: lra_194_1, onus: true}

  - id: conduct-internal-appeal-restarts-clock
