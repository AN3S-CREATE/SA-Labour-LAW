[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labour-corpus"
version = "0.1.0"
description = "Local-first harvester for South African labour-law primary sources with an unfair-dismissal ontology and a mining overlay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["south-africa", "labour-law", "unfair-dismissal", "corpus", "rag"]

dependencies = [
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "rich==15.0.0",
    "orjson==3.12.0",
    "selectolax==0.4.11",
    "lxml==6.1.3",  # transitive via python-docx; pinned for reproducibility
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "PyYAML==6.0.3",
    "certifi==2026.7.22",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
ocr = ["pymupdf==1.28.2", "rapidocr-onnxruntime==1.2.3"]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]
lint = ["ruff==0.13.3", "mypy==1.18.2", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
labour-corpus = "labour_corpus.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the network; deselected by default",
    "browser: requires Playwright Chromium (RUN_BROWSER=1)",
]

[tool.mypy]
files = ["src", "mcp", "tools"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional OCR backend: ships no type information and has no stub package.
module = ["rapidocr_onnxruntime", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true
