name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sa_labour_corpus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sa_labour_corpus/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,lint]"
      - run: ruff check .
      - run: mypy
      - run: python -m pytest
      - run: python -m labour_corpus navigate review-sheet
      - name: Offline fixture smoke test
        if: matrix.python-version == '3.13'
        run: python -m labour_corpus smoke --out "${{ runner.temp }}/labour-smoke" --contact-email ci@example.invalid
